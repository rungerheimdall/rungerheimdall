name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack -c Release -o artifacts --no-build

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push base packages
        run: |
          for pkg in \
            artifacts/RungerHeimdall.Abstractions.*.nupkg \
            artifacts/RungerHeimdall.Engine.*.nupkg \
            artifacts/RungerHeimdall.Analyzers.Architecture.*.nupkg \
            artifacts/RungerHeimdall.Analyzers.Performance.*.nupkg \
            artifacts/RungerHeimdall.Cli.*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push meta package
        run: |
          for pkg in artifacts/RungerHeimdall.Analyzers.[0-9]*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Install the latest version:

            ```
            dotnet add package RungerHeimdall.Analyzers
            dotnet tool install -g RungerHeimdall.Cli
            ```

            Docs: https://rungerheimdall.github.io/rungerheimdall/
            Rules: https://rungerheimdall.github.io/rungerheimdall/rules.html
            Benchmarks: https://github.com/rungerheimdall/rungerheimdall/blob/main/docs/benchmarks.md